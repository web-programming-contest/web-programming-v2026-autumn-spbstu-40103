<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Продажи за месяц</title>
    <link rel="stylesheet" href="styles.css" />
  </head>

        <caption class="sales-caption">

          <tr>
            <td>Ноутбук</td>

            <td>780 000 ₽</td>
          </tr>
          <tr>
            <td>Смартфон</td>

            <td>750 000 ₽</td>
          </tr>
          <tr>
            <td>Наушники</td>
            <td>40</td>
            <td>200 000 ₽</td>
          </tr>
          <tr>
            <td>Планшет</td>
            <td>15</td>
            <td>375 000 ₽</td>
          </tr>
          <tr>
            <td>Умные часы</td>
            <td>20</td>
            <td>240 000 ₽</td>
          </tr>
        </tbody>
        <tfoot>
          <tr>
            <th scope="row">Итого</th>
            <td>112</td>
            <td>2 345 000 ₽</td>
          </tr>
        </tfoot>
      </table>
    </main>

</html>
