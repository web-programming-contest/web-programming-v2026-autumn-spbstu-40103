server {
    listen 3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Отдаём собранный SPA, роутинг react-router — на index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Долгоживущий кэш для статических ассетов с хешем в имени
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Проксируем запросы к бэкенду. BACKEND_HOST задаётся через
    # docker-compose (сервис back), путь /api срезается на стороне бэка.
    location /api/ {
        proxy_pass http://back:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cookie_path / /;
    }
}
