<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Лабораторная работа 1</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main>
      <div class="card">
        <img
          src="assets/i.jpg"
          alt="Изображение товара"
          class="product-image"
        />
        <div class="product">
          <p class="title">Кружка</p>
          <p class="description">Керамическая кружка с изображением кота</p>
          <div class="reviews">
            <h1 class="reviews-title">Отзывы</h1>
            <ul class="list">
              <li class="review">
                <div class="name">Иван Иванов</div>
                <div class="review-text">
                  Красивая кружечка. Подарил маме на 8 марта.
                </div>
              </li>
              <li class="review">
                <div class="name">Анна Иванова</div>
                <div class="review-text">
                  Очень милая кружка. Сын подарил мне на 8 марта.
                </div>
              </li>
            </ul>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
